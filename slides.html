<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Radarskin Slides — SUZZIESATURN</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --black: #000; --white: #fff; --header-h: 60px; }
  body { background: var(--white); color: var(--black); font-family: 'Archivo', sans-serif; font-weight: 500; }

  header {
    position: sticky; top: 0; z-index: 100;
    background: var(--white); border-bottom: 1px solid var(--black);
    height: var(--header-h); display: flex; align-items: center;
    justify-content: space-between; padding: 0 24px;
  }
  .logo { font-family: 'Bodoni Moda', serif; font-weight: 700; font-size: clamp(13px,2vw,17px); letter-spacing: 0.12em; text-transform: uppercase; color: var(--black); text-decoration: none; }
  .header-icons { display: flex; align-items: center; gap: 20px; }
  .header-icons a, .header-icons button { background: none; border: none; cursor: pointer; color: var(--black); padding: 4px; display: flex; align-items: center; text-decoration: none; font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.6; transition: opacity 0.2s; }
  .header-icons a:hover, .header-icons button:hover { opacity: 1; }
  .header-icons svg { width: 20px; height: 20px; }

  .product-wrap {
    display: grid;
    grid-template-columns: 1fr;
    min-height: calc(100vh - var(--header-h));
  }
  @media (min-width: 768px) {
    .product-wrap { grid-template-columns: 1fr 1fr; }
  }

  /* IMAGE SIDE */
  .product-images {
    position: relative;
    background: #111;
    aspect-ratio: 1;
  }
  @media (min-width: 768px) {
    .product-images { aspect-ratio: unset; position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); }
  }
  .product-images img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.4s ease;
  }
  .product-images img.active { opacity: 1; }
  .img-dots {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 8px; z-index: 2;
  }
  .img-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.3);
    cursor: pointer; border: none; padding: 0;
    transition: background 0.2s;
  }
  .img-dot.active { background: var(--white); }

  /* INFO SIDE */
  .product-info {
    padding: clamp(32px,5vw,64px);
    display: flex; flex-direction: column; gap: 32px;
  }
  .product-breadcrumb {
    font-size: 10px; font-weight: 700; letter-spacing: 0.25em;
    text-transform: uppercase; opacity: 0.4;
  }
  .product-breadcrumb a { color: var(--black); text-decoration: none; }
  .product-title {
    font-family: 'Bodoni Moda', serif;
    font-weight: 900;
    font-size: clamp(36px,5vw,64px);
    letter-spacing: -0.02em;
    text-transform: uppercase;
    line-height: 1;
  }
  .product-price-display {
    font-family: 'Archivo', sans-serif;
    font-size: clamp(18px,2vw,22px);
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .size-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.25em;
    text-transform: uppercase; margin-bottom: 12px; opacity: 0.5;
  }
  .size-grid {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .size-btn {
    border: 1px solid #ccc;
    background: none;
    font-family: 'Archivo', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 14px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s, color 0.2s;
    white-space: nowrap;
  }
  .size-btn:hover { border-color: var(--black); }
  .size-btn.selected { background: var(--black); color: var(--white); border-color: var(--black); }

  .btn-buy {
    width: 100%;
    background: var(--black);
    color: var(--white);
    border: none;
    font-family: 'Archivo', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    padding: 20px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-buy:hover { opacity: 0.8; }
  .btn-buy:disabled { opacity: 0.3; cursor: not-allowed; }

  .product-details {
    border-top: 1px solid #eee;
    padding-top: 24px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .detail-row {
    display: flex; justify-content: space-between;
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .detail-row span:first-child { opacity: 0.4; }

  .error-msg {
    font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: red; display: none;
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="/">Suzziesaturn</a>
  <div class="header-icons">
    <a href="/">← Shop</a>
    <button aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
      </svg>
    </button>
  </div>
</header>

<div class="product-wrap">
  <!-- IMAGES -->
  <div class="product-images" id="imgWrap">
    <img src="/images/radarskin-slides-1.png" class="active" alt="Radarskin Slides"/>
    <img src="/images/radarskin-slides-2.png" alt="Radarskin Slides"/>
    <img src="/images/radarskin-slides-3.png" alt="Radarskin Slides"/>
    <div class="img-dots">
      <button class="img-dot active" data-idx="0"></button>
      <button class="img-dot" data-idx="1"></button>
      <button class="img-dot" data-idx="2"></button>
    </div>
  </div>

  <!-- INFO -->
  <div class="product-info">
    <p class="product-breadcrumb"><a href="/">Shop</a> / Radarskin Slides</p>
    <h1 class="product-title">Radarskin Slides</h1>
    <p class="product-price-display">$25.00</p>

    <div>
      <p class="size-label">Select Size</p>
      <div class="size-grid">
        <button class="size-btn" data-price="price_1TalmPJiWX4PgmRvBRnvOZlF">US M5/W7 (EU 36)</button>
        <button class="size-btn" data-price="price_1TamZSJiWX4PgmRvP8OJf3DD">US M8/W10 (EU 40)</button>
        <button class="size-btn" data-price="price_1TamZhJiWX4PgmRvPiXB9XoB">US M8.5/W10.5 (EU 41)</button>
        <button class="size-btn" data-price="price_1Tama9JiWX4PgmRvkFVDGzB">US M9.5/W11.5 (EU 43)</button>
        <button class="size-btn" data-price="price_1TamaQJiWX4PgmRvFWjOT8T8">US M10/W12 (EU 44)</button>
        <button class="size-btn" data-price="price_1TamaqJiWX4PgmRvYhBfh37">US M10.5/W12.5 (EU 45)</button>
        <button class="size-btn" data-price="price_1TambJiWX4PgmRvGA0Pq3zV">US M11/W13 (EU 46)</button>
        <button class="size-btn" data-price="price_1TambfJiWX4PgmRvgd5yhdRp">US M11.5/W13.5 (EU 47)</button>
      </div>
    </div>

    <p class="error-msg" id="errMsg">Please select a size.</p>

    <button class="btn-buy" id="buyBtn">Add to Cart — $25</button>

    <div class="product-details">
      <div class="detail-row"><span>Material</span><span>EVA Foam / Rubber</span></div>
      <div class="detail-row"><span>Sizing</span><span>Unisex EU 36–47</span></div>
      <div class="detail-row"><span>Ships</span><span>3–5 Business Days</span></div>
      <div class="detail-row"><span>Returns</span><span>30 Days</span></div>
    </div>
  </div>
</div>

<script>
  // Image switcher
  const imgs = document.querySelectorAll('.product-images img');
  const dots = document.querySelectorAll('.img-dot');
  dots.forEach(dot => {
    dot.addEventListener('click', () => {
      const i = +dot.dataset.idx;
      imgs.forEach(img => img.classList.remove('active'));
      dots.forEach(d => d.classList.remove('active'));
      imgs[i].classList.add('active');
      dot.classList.add('active');
    });
  });

  // Size selector
  let selectedPrice = null;
  const sizeBtns = document.querySelectorAll('.size-btn');
  sizeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      sizeBtns.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedPrice = btn.dataset.price;
      document.getElementById('errMsg').style.display = 'none';
    });
  });

  // Checkout
  document.getElementById('buyBtn').addEventListener('click', async () => {
    if (!selectedPrice) {
      document.getElementById('errMsg').style.display = 'block';
      return;
    }
    const btn = document.getElementById('buyBtn');
    btn.disabled = true;
    btn.textContent = 'Loading...';
    try {
      const res = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ priceId: selectedPrice })
      });
      const data = await res.json();
      window.location.href = data.url;
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Add to Cart — $25';
      alert('Something went wrong. Try again.');
    }
  });
</script>
</body>
</html>
